name: Compilar APK de El Radar

on:
  workflow_dispatch:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Instalar Android SDK en GitHub
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas Android
        shell: bash
        run: |
          set -e
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Comprobar que la PWA de El Radar está publicada
        shell: bash
        run: |
          set -e
          curl -fsS "https://elradar.infinityfree.io/index.php?radar_manifest=1" -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1); console.log('Manifiesto PWA correcto:',m.name)"
          curl -fsS "https://elradar.infinityfree.io/index.php?radar_sw=1" | grep -q "push"
          curl -fsSI "https://elradar.infinityfree.io/index.php?radar_icon=512" | grep -qi "image/png"

      - name: Preparar clave de firma persistente
        shell: bash
        run: |
          set -e
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
            test -s android.keystore
            echo "Se utilizará la clave guardada en GitHub Secrets."
          else
            echo "No hay clave guardada. Se crea una clave temporal de PRUEBA."
            keytool -genkeypair -v \
              -keystore android.keystore \
              -storepass android \
              -alias android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=El Radar, OU=Android, O=El Radar, L=NA, S=NA, C=US"
          fi

      - name: Instalar Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generar el proyecto Android desde la configuración TWA
        run: bubblewrap update --skipVersionUpgrade

      - name: Compilar APK firmado y AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: bubblewrap build --skipPwaValidation

      - name: Crear assetlinks.json para validar la aplicación
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          set -e
          SHA256="$(keytool -list -v -keystore android.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias android | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$SHA256"
          mkdir -p salida
          cat > salida/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.algmedia91.elradar",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF
          cp app-release-signed.apk salida/El-Radar-35.apk
          if [ -f app-release-bundle.aab ]; then cp app-release-bundle.aab salida/El-Radar-35.aab; fi
          cp android.keystore salida/android.keystore
          echo "Huella SHA-256: $SHA256"

      - name: Publicar APK, AAB, clave y assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: El-Radar-35-APK-y-configuracion
          path: salida/
          if-no-files-found: error
          retention-days: 30

