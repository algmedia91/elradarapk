name: Compilar APK de El Radar

on:
  workflow_dispatch:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Esta acción instala las herramientas de línea de comandos y acepta
      # automáticamente las licencias del SDK Android.
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verificar Android SDK instalado
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          adb version
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

      - name: Comprobar que la PWA de El Radar está publicada
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 -fsS "https://elradar.infinityfree.io/index.php?radar_manifest=1" -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1); console.log('Manifiesto PWA correcto:',m.name)"
          curl --retry 3 --retry-delay 3 -fsS "https://elradar.infinityfree.io/index.php?radar_sw=1" | grep -qi "push"
          curl --retry 3 --retry-delay 3 -fsSI "https://elradar.infinityfree.io/index.php?radar_icon=512" | grep -qi "image/png"

      - name: Preparar clave de firma
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
            test -s android.keystore
            echo "Se utilizará la clave guardada en GitHub Secrets."
          else
            echo "AVISO: se crea una clave temporal para esta compilación de prueba."
            keytool -genkeypair -v \
              -keystore android.keystore \
              -storepass android \
              -alias android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=El Radar, OU=Android, O=El Radar, L=NA, S=NA, C=US"
          fi

      - name: Instalar Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Actualizar proyecto Android Bubblewrap
        run: bubblewrap update --skipVersionUpgrade

      - name: Compilar APK firmado y AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: bubblewrap build --skipPwaValidation

      - name: Crear assetlinks.json
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          SHA256="$(keytool -list -v -keystore android.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias android | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$SHA256"
          mkdir -p salida
          cat > salida/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.algmedia91.elradar",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF
          test -f app-release-signed.apk
          cp app-release-signed.apk salida/El-Radar-35.apk
          if [ -f app-release-bundle.aab ]; then cp app-release-bundle.aab salida/El-Radar-35.aab; fi
          cp android.keystore salida/android.keystore
          echo "Huella SHA-256: $SHA256"

      - name: Publicar archivos generados
        uses: actions/upload-artifact@v4
        with:
          name: El-Radar-35-APK-y-configuracion
          path: salida/
          if-no-files-found: error
          retention-days: 30

